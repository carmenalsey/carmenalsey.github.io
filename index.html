<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuddieFun</title>

  <link rel="icon" href="assets/icon/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- BuddieFun Direct Link: shared 10-minute cap across Homepage and Watch. -->
  <script>
    (() => {
      // Direct Link URL for BuddieFun.
      const DIRECT_LINK_URL = 'https://uplcm.com/4/11945240';
      const COOLDOWN_MS = 10 * 60 * 1000;
      const STORAGE_KEY = 'buddiefun_directlink_last_open_v1';
      let fallbackLastOpen = 0;

      function handleFirstClick(event) {
        if (!event.isTrusted || event.button !== 0) return;

        let destination;
        try {
          destination = new URL(DIRECT_LINK_URL);
          if (destination.protocol !== 'https:') return;
        } catch (_) { return; }

        let lastOpen = fallbackLastOpen;
        try {
          lastOpen = Number(localStorage.getItem(STORAGE_KEY)) || 0;
        } catch (_) { /* Storage may be disabled. */ }
        const now = Date.now();
        if (now - lastOpen < COOLDOWN_MS && now >= lastOpen) return;

        // Must run synchronously inside the real click for popup blockers.
        // Browser controls whether the new tab appears in front or behind.
        const adWindow = window.open(destination.href, '_blank', 'noopener');
        if (adWindow === null) return;

        fallbackLastOpen = now;
        try { localStorage.setItem(STORAGE_KEY, String(now)); }
        catch (_) { /* In-memory cap applies for this page. */ }
      }

      document.addEventListener('click', handleFirstClick, { capture: true });
    })();
  </script>

</head>
<body>

  <!-- HEADER -->
  <header class="topbar">

    <a href="index.html" class="logo" aria-label="Buddie Fun — Home"><img src="assets/icon/logo.webp" alt="Buddie Fun" width="160" height="50"></a>

      <label class="category-dropdown-wrap">
        <span class="sr-only">All categories</span>

        id="searchInput"

  </header>

  <!-- VIDEO GRID -->
  <main class="container">

    <section id="videoGrid" class="video-grid" aria-live="polite"></section>

    <!-- Pagination: 30 videos per page -->
    <nav id="videoPagination" class="video-pagination" aria-label="Video pages" hidden>
      <button id="prevPage" type="button" disabled>Previous</button>
      <span id="pageInfo" aria-live="polite">Page 1</span>
      <button id="nextPage" type="button" disabled>Next</button>
    </nav>

    <div id="loadingGrid" class="loading-grid">

      <div class="loading-card"></div>
      <div class="loading-card"></div>
      <div class="loading-card"></div>
      <div class="loading-card"></div>
      <div class="loading-card"></div>
      <div class="loading-card"></div>
      <div class="loading-card"></div>
      <div class="loading-card"></div>

    </div>

  </main>


  <!-- VIDEO TEMPLATE -->
  <template id="videoTemplate">

    <article class="video-card">

      <a class="video-link">

        <div class="thumb-box">

          <img class="thumb" loading="lazy">

          <span class="duration"></span>

        </div>

        <div class="meta">

          <h3 class="title"></h3>

          <p class="views"></p>

        </div>

      </a>

    </article>

  </template>


  <script src="assets/js/search.js"></script>
  <script src="assets/js/app.js"></script>

  <!-- Pagination: 30 video cards per page; compatible with app.js/search.js -->
  <style>
    .video-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin: 28px 0;
    }
    .video-pagination[hidden] { display: none !important; }
    .video-pagination button {
      padding: 9px 16px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #222;
      color: inherit;
      cursor: pointer;
    }
    .video-pagination button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .video-pagination #pageInfo { font-size: .95rem; }
  </style>
  <script>
    (() => {
      const PAGE_SIZE = 30;
      const grid = document.getElementById("videoGrid");
      const pagination = document.getElementById("videoPagination");
      const prevButton = document.getElementById("prevPage");
      const nextButton = document.getElementById("nextPage");
      const pageInfo = document.getElementById("pageInfo");
      const searchInput = document.getElementById("searchInput");

      let currentPage = 1;
      let updateQueued = false;
      let lastCardCount = 0;

      // app.js/search.js filters by rebuilding the grid, not by hidden/display.
      // Do NOT use getComputedStyle(card).display here: pagination itself hides
      // off-page cards, which would make the script incorrectly think there is
      // only one page.
      function getMatchingCards() {
        return Array.from(grid.querySelectorAll(".video-card"))
          .filter(card => card.style.display !== "none");
      }

      function renderPagination(resetPage = false) {
        if (resetPage) currentPage = 1;

        const cards = getMatchingCards();
        const totalPages = Math.max(1, Math.ceil(cards.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * PAGE_SIZE;
        cards.forEach((card, index) => {
          card.hidden = index < start || index >= start + PAGE_SIZE;
        });

        pagination.hidden = cards.length <= PAGE_SIZE;
        prevButton.disabled = currentPage <= 1;
        nextButton.disabled = currentPage >= totalPages;
        pageInfo.textContent = cards.length
          ? "Page " + currentPage + " of " + totalPages + " · " + cards.length + " videos"
          : "No videos found";
        lastCardCount = grid.querySelectorAll(".video-card").length;
      }

      prevButton.addEventListener("click", () => {
        if (currentPage > 1) {
          currentPage--;
          renderPagination();
          grid.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });

      nextButton.addEventListener("click", () => {
        const totalPages = Math.max(1, Math.ceil(getMatchingCards().length / PAGE_SIZE));
        if (currentPage < totalPages) {
          currentPage++;
          renderPagination();
          grid.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });

      // Reset to page 1 when the search changes.
      if (searchInput) {
        searchInput.addEventListener("input", () => {
          currentPage = 1;
          queueUpdate();
        });
      }

      function queueUpdate() {
        if (updateQueued) return;
        updateQueued = true;
        requestAnimationFrame(() => {
          updateQueued = false;
          renderPagination();
        });
      }

      // Watch card creation/removal only. Do not observe attributes: pagination
      // changes the hidden attribute on cards and would trigger unnecessary work.
      const observer = new MutationObserver(() => {
        const count = grid.querySelectorAll(".video-card").length;
        if (count !== lastCardCount) {
          currentPage = 1;
        }
        queueUpdate();
      });
      observer.observe(grid, { childList: true, subtree: true });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => renderPagination(true), { once: true });
      } else {
        renderPagination(true);
      }
      queueUpdate();
    })();
  </script>

  <!-- Basic browser shortcut/context-menu deterrent -->
  <script>
    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });

    document.addEventListener("keydown", function (event) {
      const key = (event.key || "").toLowerCase();
      if (event.ctrlKey && key === "u") {
        event.preventDefault();
      }
    });
  </script>
